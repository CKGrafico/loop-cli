version: 2

loops:
  - taskId: fetch-issues
    interval: 10000
    intervalHuman: 10s
    description: Fetch issue count; on failure log silently, on success report
    maxRuns: 10000

tasks:
  - id: fetch-issues
    name: Fetch issues
    command: gh
    commandArgs:
      - issue
      - list
      - --state
      - all
      - --json
      - number
      - --limit
      - "500"
      - --jq
      - "{total: length}"
    onSuccessTaskId: report
    onFailureTaskId: log-silent-error

  - id: report
    name: Report count
    command: echo
    commandArgs:
      - "total issues (open + closed): {{total}}"
    onSuccessTaskId: null
    onFailureTaskId: null

  - id: log-silent-error
    name: Log error (silent)
    command: echo
    commandArgs:
      - "gh failed or not authenticated, nothing to report"
    silentChain: true
    onSuccessTaskId: null
    onFailureTaskId: null

diagram: |
  flowchart TD
      fetchStart("Start<br/>Fetch issue count") --> fetchIssues
      fetchIssues["Fetch issues<br/>gh issue list + count"] -->|✓| report
      fetchIssues -.->|✗| logSilentError
      report(("Complete<br/>Echo total issue count"))
      logSilentError(("Fail<br/>Silent chain fallback"))
      classDef start fill:#ffffff,stroke:#172033,stroke-width:2px,color:#172033
      classDef decision fill:#fff8e8,stroke:#c75b00,stroke-width:2px,color:#172033
      classDef idle fill:#202c40,stroke:#738198,stroke-width:2px,color:#ffffff
      classDef failure fill:#fff0f0,stroke:#ef2929,stroke-width:2px,color:#8b1a1a
      classDef success fill:#e8f8ec,stroke:#18883c,stroke-width:2px,color:#145a32
      class fetchStart start
      class fetchIssues decision
      class report success
      class logSilentError idle
