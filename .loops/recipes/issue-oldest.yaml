version: 2

loops:
  - taskId: list-issues
    intervalHuman: "0"
    description: List all repo issues (open + closed), print the oldest

tasks:
  - id: list-issues
    name: List all issues
    command: gh
    commandArgs:
      - issue
      - list
      - --state
      - all
      - --json
      - number,title,createdAt
      - --limit
      - "500"
      - --jq
      - "sort_by(.createdAt) | {oldestNumber: .[0].number, oldestTitle: .[0].title, oldestCreatedAt: .[0].createdAt, total: length}"
    onSuccessTaskId: print-oldest
    onFailureTaskId: null

  - id: print-oldest
    name: Print oldest issue
    command: echo
    commandArgs:
      - "oldest issue: #{{oldestNumber}} {{oldestTitle}} ({{oldestCreatedAt}}) - total: {{total}}"
    onSuccessTaskId: null
    onFailureTaskId: null

diagram: |
  flowchart TD
      listStart("Start<br/>List all repo issues") --> listIssues
      listIssues["List issues<br/>Fetch open+closed via gh"] -->|✓| printOldest
      listIssues -.->|✗| listFail
      printOldest("Print oldest<br/>Echo #number + title + date")
      listFail(("Fail<br/>gh not authenticated or error"))
      classDef start fill:#ffffff,stroke:#172033,stroke-width:2px,color:#172033
      classDef action fill:#eef0ff,stroke:#554cff,stroke-width:2px,color:#172033
      classDef decision fill:#fff8e8,stroke:#c75b00,stroke-width:2px,color:#172033
      classDef failure fill:#fff0f0,stroke:#ef2929,stroke-width:2px,color:#8b1a1a
      classDef success fill:#e8f8ec,stroke:#18883c,stroke-width:2px,color:#145a32
      class listStart start
      class printOldest action
      class listIssues decision
      class listFail failure
